name: Radar Emploi → Notion

# Recopie dans Notion les actions faites dans l'application (favoris, candidatures, retraits, ajouts, sources).
# Déclenché par l'application avec la clé GitHub personnelle de l'utilisateur. Les actions arrivent chiffrées
# (secret RADAR_SYNC_KEY) : le dépôt est public, le journal n'affiche que des nombres.

on:
  workflow_dispatch:
    inputs:
      actions:
        description: "Actions chiffrées (envoyées par l'application)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notion-action
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Installer le déchiffrement
        run: python -m pip install --quiet "cryptography==44.0.0"
      - name: Appliquer les actions dans Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RADAR_SYNC_KEY: ${{ secrets.RADAR_SYNC_KEY }}
          ACTIONS: ${{ inputs.actions }}
        run: python scripts/notion_action.py
