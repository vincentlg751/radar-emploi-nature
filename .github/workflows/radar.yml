name: Radar Emploi Nature

# Comme l'app « Expositions » : chaque matin, le robot lit la base Notion (secret NOTION_TOKEN) et publie
# sur GitHub Pages l'application et la liste des offres (offres.json). Aucun serveur, aucun abonnement.

on:
  schedule:
    - cron: "15 6 * * *"   # chaque jour à 6h15 UTC (7h15 à Paris en hiver), après la veille Claude de 5h40
  push:
    branches: [main]
    paths:
      - "radar-template.html"
      - "radar-app/**"
      - "scripts/**"
      - ".github/workflows/radar.yml"
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Actions épinglées par SHA de commit complet (version en commentaire), mises à jour par Dependabot.
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lire Notion et générer l'application
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/build.py
      - name: Renvoyer l'ancienne adresse d'Expos du moment vers son nouveau dépôt
        run: python scripts/expositions_redirect.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

