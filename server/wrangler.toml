# Serveur personnel de Radar Emploi Nature, publié par .github/workflows/serveur.yml.
name = "radar-emploi"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Adresses autorisées à appeler le serveur (en plus de l'application Android / iPhone).
ALLOWED_ORIGINS = "https://vincentlg751.github.io"

[observability]
enabled = true
