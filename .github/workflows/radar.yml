name: Radar Emploi Nature

# Publie l'application Radar Emploi Nature sur GitHub Pages. La page ne contient aucune offre :
# elle les lit dans Notion à travers le serveur personnel (server/, robot serveur.yml).

on:
  push:
    branches: [main]
    paths:
      - "radar-template.html"
      - "radar-app/**"
      - "scripts/**"
      - ".github/workflows/radar.yml"
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Actions épinglées par SHA de commit complet (version en commentaire), mises à jour par Dependabot.
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Générer l'application (sans données : elles passent par le serveur personnel)
        env:
          RADAR_SERVER: ${{ vars.RADAR_SERVER }}
        run: python scripts/build.py
      - name: Renvoyer l'ancienne adresse d'Expos du moment vers son nouveau dépôt
        run: python scripts/expositions_redirect.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

