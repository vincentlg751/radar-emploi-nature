<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expos du moment</title>
<meta name="description" content="Toutes les expositions en cours à Paris : gratuites et payantes, sur une carte, par thématique.">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<script>
/* Mode automatique selon l'heure : nuit de 20h à 7h, jour sinon. Appliqué avant l'affichage pour éviter un flash. */
(function () {
  var h = new Date().getHours();
  document.documentElement.setAttribute("data-theme", h >= 20 || h < 7 ? "dark" : "light");
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expos">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root {
  --bg: #F4F1EA; --surface: #FFFFFF; --sunk: #EAE6DC; --ink: #1B1916; --muted: #6B655B; --line: #DCD6C9;
  --accent: #B4442B; --accent-soft: #F5E1DA; --accent-ink: #FFFFFF;
  --free: #2F6F4F; --free-soft: #DCEDE2; --paid: #6A4BA0; --paid-soft: #E9E2F5; --unk: #8A7A55; --unk-soft: #F0EAD8;
  --new: #B4442B;
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --f-display: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --r: 14px; --tab-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121110; --surface: #1C1A18; --sunk: #262320; --ink: #EEE9E0; --muted: #A39C90; --line: #33302B;
    --accent: #E7765B; --accent-soft: #3A2019; --accent-ink: #1A0F0B;
    --free: #77C59B; --free-soft: #17301F; --paid: #B79CF0; --paid-soft: #29203A; --unk: #D2BE8C; --unk-soft: #322B1A; --new: #E7765B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121110; --surface: #1C1A18; --sunk: #262320; --ink: #EEE9E0; --muted: #A39C90; --line: #33302B;
  --accent: #E7765B; --accent-soft: #3A2019; --accent-ink: #1A0F0B;
  --free: #77C59B; --free-soft: #17301F; --paid: #B79CF0; --paid-soft: #29203A; --unk: #D2BE8C; --unk-soft: #322B1A; --new: #E7765B;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.4;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

header.top { padding-top: calc(env(safe-area-inset-top, 0px) + 18px); }
h1 { font-family: var(--f-display); font-size: clamp(28px, 8vw, 34px); line-height: 1.05; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.sub b { color: var(--new); font-weight: 600; }

.sticky { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 6px; margin-top: 8px; }
#v-map { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 60px); }
.seg { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg .n { font-weight: 500; opacity: .7; margin-left: 3px; font-variant-numeric: tabular-nums; }

.search { margin-top: 10px; position: relative; }
.search input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px 10px 36px; border-radius: 10px; border: 0; background: var(--sunk); color: var(--ink); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px calc(-1 * max(16px, env(safe-area-inset-left))) 0; padding: 0 max(16px, env(safe-area-inset-left)) 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.flag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.row select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

.list { display: grid; gap: 10px; padding-top: 6px; padding-bottom: 20px; }
.card { display: grid; grid-template-columns: 76px 1fr; gap: 12px; background: var(--surface); border-radius: var(--r); padding: 10px; border: 0; text-align: left; width: 100%; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.thumb { width: 76px; height: 96px; border-radius: 9px; background: var(--sunk) center/cover no-repeat; display: grid; place-items: center; color: var(--muted); font-family: var(--f-display); font-size: 28px; }
.card h2 { font-size: 16px; line-height: 1.25; margin: 1px 0 3px; font-weight: 650; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { font-size: 13px; color: var(--muted); }
.meta + .meta { margin-top: 1px; }
.badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.b { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--muted); }
.b.free { background: var(--free-soft); color: var(--free); }
.b.paid { background: var(--paid-soft); color: var(--paid); }
.b.unk { background: var(--unk-soft); color: var(--unk); }
.b.new { background: var(--accent); color: var(--accent-ink); }
.b.soon { background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }

#map { height: calc(100dvh - var(--tab-h) - env(safe-area-inset-bottom, 0px) - 80px); min-height: 300px; border-radius: var(--r); overflow: hidden; margin-top: 6px; background: var(--sunk); }
.leaflet-container { font-family: var(--f); }
/* Carte en mode nuit : tuiles inversées, teintes conservées */
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); } }
.headrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.mode { flex: none; display: flex; align-items: center; gap: 5px; background: var(--sunk); color: var(--accent); border-radius: 999px; padding: 6px 11px 6px 9px; margin-top: 6px; font-size: 12.5px; font-weight: 600; }
.mode svg { width: 17px; height: 17px; }
.mode span { color: var(--muted); }
:root[data-theme="dark"] .mode .sun, :root[data-theme="light"] .mode .moon { display: none; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr);
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { border: 0; background: none; height: var(--tab-h); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-pressed="true"] { color: var(--accent); }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; opacity: 0; transition: opacity .2s; }
.sheet-bg.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 18px 18px 0 0; max-height: 92dvh; overflow-y: auto;
  transform: translateY(100%); transition: transform .25s ease; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); max-width: 760px; margin: 0 auto; overscroll-behavior: contain; }
.sheet.open { transform: none; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto; }
.sheet .hero { height: 200px; background: var(--sunk) center/cover no-repeat; margin: 0 16px; border-radius: 12px; }
.sheet .in { padding: 14px 18px 0; }
.sheet h2 { font-family: var(--f-display); font-size: 25px; line-height: 1.15; margin: 8px 0 6px; }
.sheet p { margin: 8px 0; }
.kv { display: grid; grid-template-columns: 22px 1fr; gap: 6px 10px; margin: 14px 0; font-size: 15px; }
.kv svg { width: 18px; height: 18px; color: var(--muted); margin-top: 2px; }
.warn { background: var(--unk-soft); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; margin: 10px 0; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; border-radius: 12px; padding: 12px; font-weight: 600; font-size: 15px; background: var(--sunk); color: var(--ink); border: 0; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.full { grid-column: 1 / -1; }
.close { position: absolute; right: 12px; top: 10px; border: 0; background: var(--sunk); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.src { font-size: 12px; color: var(--muted); margin-top: 16px; }
.install { background: var(--surface); border-radius: var(--r); padding: 12px 14px; margin-top: 12px; font-size: 14px; display: flex; gap: 10px; align-items: start; }
.install button { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
</style>
</head>
<body>
<header class="top wrap">
  <div class="headrow">
    <h1>Expos du moment</h1>
    <div class="mode" id="mode" role="img" aria-label="Mode automatique" title="Automatique : nuit de 20h à 7h">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      <span>Auto</span>
    </div>
  </div>
  <div class="sub" id="sub">Chargement…</div>
  <div class="install" id="install" hidden>
    <span>Pour l'installer sur l'iPhone : touchez <b>Partager</b> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M12 3v13M7 8l5-5 5 5M5 12v8h14v-8"/></svg> puis <b>Sur l'écran d'accueil</b>.</span>
    <button id="install-x" aria-label="Fermer">×</button>
  </div>
</header>

<div class="sticky" id="sticky">
  <div class="wrap">
    <div class="seg" role="group" aria-label="Tarif">
      <button data-tarif="gratuit" aria-pressed="true">Gratuites<span class="n" id="n-gratuit"></span></button>
      <button data-tarif="payant" aria-pressed="false">Payantes<span class="n" id="n-payant"></span></button>
      <button data-tarif="tout" aria-pressed="false">Toutes<span class="n" id="n-tout"></span></button>
    </div>
  </div>
</div>
<div class="wrap" id="filters">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Artiste, musée, quartier…" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="chips" id="flags" aria-label="Filtre rapide">
      <button class="chip flag" data-flag="nouveau" aria-pressed="false">Nouveautés</button>
      <button class="chip flag" data-flag="fin" aria-pressed="false">Finit bientôt</button>
      <button class="chip flag" data-flag="fav" aria-pressed="false">★ Favoris</button>
    </div>
    <div class="chips" id="themes" aria-label="Thématiques"></div>
    <div class="row">
      <span id="count"></span>
      <select id="sort" aria-label="Trier">
        <option value="fin">Fin la plus proche</option>
        <option value="recent">Ajoutées récemment</option>
        <option value="dist">Les plus proches de moi</option>
        <option value="prix">Prix croissant</option>
      </select>
    </div>
</div>

<main class="wrap">
  <section id="v-list" class="list" aria-live="polite"></section>
  <section id="v-map" hidden><div id="map"></div></section>
</main>

<nav class="tabs" aria-label="Vues">
  <button data-view="list" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Liste</button>
  <button data-view="map" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Carte</button>
  <button data-view="near" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Près de moi</button>
</nav>

<div class="sheet-bg" id="sheet-bg" hidden></div>
<article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden></article>

<script>
"use strict";
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("expos:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("expos:" + k, JSON.stringify(v)); } catch {} }
};
const state = {
  data: null, tarif: store.get("tarif", "gratuit"), q: "", themes: new Set(), flags: new Set(),
  sort: "fin", view: "list", pos: null, favs: new Set(store.get("favs", [])),
  seenBefore: new Set(store.get("seen", [])), firstVisit: store.get("seen", null) == null
};
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const iso = d => d.toISOString().slice(0, 10);
const parse = s => s ? new Date(s + "T00:00:00") : null;
const days = (a, b) => Math.round((b - a) / 864e5);
const fmt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
const fmtY = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const famille = e => { const t = e.tarif?.type; return t === "gratuit" || t === "gratuit_sous_condition" ? "gratuit" : t === "payant" ? "payant" : "inconnu"; };
function isNew(e) {
  if (!state.firstVisit && !state.seenBefore.has(e.id)) return true;   // apparue depuis ma dernière visite
  const v = parse(e.vu_le); return v && days(v, TODAY) <= 7;           // ajoutée à la base cette semaine
}
const upcoming = e => { const d = parse(e.debut); return d && d > TODAY; };
const endsSoon = e => { const f = parse(e.fin); return f && days(TODAY, f) <= 14; };
function dist(e) {
  if (!state.pos || e.lat == null) return null;
  const R = 6371, r = x => x * Math.PI / 180, [la1, lo1] = state.pos;
  const dLa = r(e.lat - la1), dLo = r(e.lon - lo1);
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(r(la1)) * Math.cos(r(e.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const kmTxt = d => d == null ? "" : d < 1 ? Math.round(d * 1000 / 50) * 50 + " m" : d.toFixed(d < 10 ? 1 : 0).replace(".", ",") + " km";
function prixTxt(e) {
  const t = e.tarif || {};
  if (t.type === "gratuit") return ["Gratuit", "free"];
  if (t.type === "gratuit_sous_condition") return ["Gratuit sous condition", "free"];
  if (t.type === "payant") return [t.prix_min ? `Dès ${String(t.prix_min).replace(".", ",")} €` : "Payant", "paid"];
  return ["Tarif à vérifier", "unk"];
}
function datesTxt(e) {
  const d = parse(e.debut), f = parse(e.fin);
  if (d && d > TODAY) return `À partir du ${fmt.format(d)}` + (f ? ` · jusqu'au ${fmtY.format(f)}` : "");
  if (f) { const n = days(TODAY, f); return n === 0 ? "Dernier jour aujourd'hui" : n <= 14 ? `Plus que ${n} jour${n > 1 ? "s" : ""}` : `Jusqu'au ${fmtY.format(f)}`; }
  return "En cours";
}

function filtered(ignoreTarif) {
  const q = norm(state.q).trim();
  return state.data.expositions.filter(e =>
    (ignoreTarif || state.tarif === "tout" || famille(e) === state.tarif) &&
    (!state.themes.size || (e.thematiques || []).some(t => state.themes.has(t))) &&
    (!state.flags.has("nouveau") || isNew(e)) &&
    (!state.flags.has("fin") || endsSoon(e)) &&
    (!state.flags.has("fav") || state.favs.has(e.id)) &&
    (!q || norm([e.titre, e.lieu, e.adresse, e.resume, (e.thematiques || []).join(" ")].join(" ")).includes(q)));
}
function sorted(list) {
  const by = {
    fin: (a, b) => (a.fin || "9999").localeCompare(b.fin || "9999"),
    recent: (a, b) => (b.vu_le || "").localeCompare(a.vu_le || "") || (a.fin || "").localeCompare(b.fin || ""),
    dist: (a, b) => (dist(a) ?? 1e9) - (dist(b) ?? 1e9),
    prix: (a, b) => (a.tarif?.prix_min ?? (famille(a) === "gratuit" ? 0 : 999)) - (b.tarif?.prix_min ?? (famille(b) === "gratuit" ? 0 : 999)),
  }[state.sort];
  return list.slice().sort(by);
}

function renderCounts() {
  const all = filtered(true);
  $("#n-gratuit").textContent = all.filter(e => famille(e) === "gratuit").length;
  $("#n-payant").textContent = all.filter(e => famille(e) === "payant").length;
  $("#n-tout").textContent = all.length;
}
function card(e) {
  const [p, cls] = prixTxt(e), d = dist(e), initial = esc((e.titre || "?").trim()[0]);
  return `<button class="card" data-id="${esc(e.id)}">
    <div class="thumb" ${e.image ? `style="background-image:url('${esc(e.image)}')"` : ""}>${e.image ? "" : initial}</div>
    <div>
      <h2>${state.favs.has(e.id) ? "★ " : ""}${esc(e.titre)}</h2>
      <div class="meta">${esc(e.lieu || e.adresse || "Lieu à préciser")}${d != null ? " · " + kmTxt(d) : ""}</div>
      <div class="meta">${esc(datesTxt(e))}</div>
      <div class="badges">
        ${isNew(e) ? '<span class="b new">Nouveau</span>' : ""}
        ${upcoming(e) ? '<span class="b soon">Bientôt</span>' : ""}
        <span class="b ${cls}">${esc(p)}</span>
        ${(e.thematiques || []).slice(0, 2).map(t => `<span class="b">${esc(t)}</span>`).join("")}
      </div>
    </div></button>`;
}
function renderList(list) {
  const el = $("#v-list");
  el.innerHTML = list.length ? list.map(card).join("") :
    `<p class="empty">Aucune exposition ne correspond.<br>Essayez une autre thématique ou l'onglet « Toutes ».</p>`;
}
function render() {
  if (!state.data) return;
  renderCounts();
  const list = sorted(filtered(false));
  $("#count").textContent = `${list.length} exposition${list.length > 1 ? "s" : ""}`;
  if (state.view === "map") renderMap(list); else renderList(list);
}

function renderThemes() {
  const counts = {};
  state.data.expositions.forEach(e => (e.thematiques || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  const names = Object.keys(counts).sort((a, b) => (a === "Autres") - (b === "Autres") || counts[b] - counts[a]);
  $("#themes").innerHTML = names.map(t => `<button class="chip" data-theme="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join("");
}

/* ---------- Carte (Leaflet chargé à la demande) ---------- */
let map, layer, leafletLoading;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return leafletLoading ||= new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "vendor/leaflet.js";
    s.onload = ok; s.onerror = ko; document.head.appendChild(s);
  });
}
async function renderMap(list) {
  try { await loadLeaflet(); } catch { $("#map").innerHTML = '<p class="empty">Carte indisponible pour le moment.</p>'; return; }
  if (!map) {
    map = L.map("map", { zoomControl: false }).setView([48.8566, 2.3522], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 50);
  layer.clearLayers();
  const css = getComputedStyle(document.documentElement), pts = [];
  list.filter(e => e.lat != null && e.lon != null).forEach(e => {
    const f = famille(e), col = css.getPropertyValue(f === "gratuit" ? "--free" : f === "payant" ? "--paid" : "--unk").trim();
    const m = L.circleMarker([e.lat, e.lon], { radius: 8, color: "#fff", weight: 2, fillColor: col, fillOpacity: .95 });
    m.bindTooltip(e.titre).on("click", () => openSheet(e.id));
    m.addTo(layer); pts.push([e.lat, e.lon]);
  });
  if (state.pos) L.circleMarker(state.pos, { radius: 7, color: "#fff", weight: 3, fillColor: "#0A84FF", fillOpacity: 1 }).addTo(layer);
  if (pts.length) map.fitBounds(pts.concat(state.pos ? [state.pos] : []), { padding: [30, 30], maxZoom: 15 });
}

/* ---------- Fiche détaillée ---------- */
const ICON = {
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  euro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 6.5A7 7 0 1 0 17 17.5M4 10h9M4 14h9"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V3h9l9 9-9 9-9-9Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};
function openSheet(id) {
  const e = state.data.expositions.find(x => x.id === id); if (!e) return;
  const [p, cls] = prixTxt(e), t = e.tarif || {}, d = dist(e);
  const q = encodeURIComponent([e.lieu, e.adresse].filter(Boolean).join(", "));
  const maps = e.lat != null ? `https://maps.apple.com/?daddr=${e.lat},${e.lon}&q=${encodeURIComponent(e.lieu || e.titre)}` : `https://maps.apple.com/?q=${q}`;
  const deb = parse(e.debut), fin = parse(e.fin);
  $("#sheet").innerHTML = `
    <div class="grab"></div><button class="close" data-close aria-label="Fermer">×</button>
    ${e.image ? `<div class="hero" style="background-image:url('${esc(e.image)}')"></div>` : ""}
    <div class="in">
      <div class="badges">${isNew(e) ? '<span class="b new">Nouveau</span>' : ""}<span class="b ${cls}">${esc(p)}</span>${(e.thematiques || []).map(x => `<span class="b">${esc(x)}</span>`).join("")}</div>
      <h2 id="d-title">${esc(e.titre)}</h2>
      ${e.resume ? `<p>${esc(e.resume)}</p>` : ""}
      ${e.a_verifier ? '<div class="warn">Certaines informations (tarif ou dates) ne sont pas confirmées : vérifiez auprès du lieu avant de vous déplacer.</div>' : ""}
      <div class="kv">
        ${ICON.cal}<div>${deb ? fmtY.format(deb) : "?"} → ${fin ? fmtY.format(fin) : "?"}<br><span class="meta">${esc(datesTxt(e))}</span></div>
        ${e.horaires ? ICON.clock + `<div class="meta">${esc(e.horaires)}</div>` : ""}
        ${ICON.pin}<div><b>${esc(e.lieu || "")}</b><br><span class="meta">${esc(e.adresse || "")}${d != null ? " · à " + kmTxt(d) : ""}</span></div>
        ${ICON.euro}<div>${esc(p)}${t.detail ? `<br><span class="meta">${esc(t.detail)}</span>` : ""}${t.reservation ? '<br><span class="meta">Réservation conseillée</span>' : ""}</div>
      </div>
      <div class="actions">
        <a class="btn primary" href="${maps}" target="_blank" rel="noopener">Itinéraire</a>
        <button class="btn" data-fav="${esc(e.id)}">${state.favs.has(e.id) ? "★ Favori" : "☆ Favori"}</button>
        ${t.billetterie && t.billetterie !== e.lien ? `<a class="btn" href="${esc(t.billetterie)}" target="_blank" rel="noopener">Réserver</a>` : ""}
        ${e.lien ? `<a class="btn ${t.billetterie && t.billetterie !== e.lien ? "" : "full"}" href="${esc(e.lien)}" target="_blank" rel="noopener">Site de l'expo</a>` : ""}
      </div>
      <div class="src">Source : ${esc(e.source || "")} · dans la base depuis le ${e.vu_le ? fmtY.format(parse(e.vu_le)) : "?"}</div>
    </div>`;
  const s = $("#sheet"), bg = $("#sheet-bg");
  s.hidden = bg.hidden = false; s.scrollTop = 0;
  requestAnimationFrame(() => { s.classList.add("open"); bg.classList.add("open"); });
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  const s = $("#sheet"), bg = $("#sheet-bg");
  s.classList.remove("open"); bg.classList.remove("open");
  setTimeout(() => { s.hidden = bg.hidden = true; }, 250);
  document.body.style.overflow = "";
}

/* ---------- Géolocalisation ---------- */
function locate() {
  return new Promise(ok => {
    if (!navigator.geolocation) return ok(false);
    navigator.geolocation.getCurrentPosition(p => { state.pos = [p.coords.latitude, p.coords.longitude]; ok(true); },
      () => { alert("Localisation refusée. Autorisez-la dans Réglages › Safari › Position."); ok(false); },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
  });
}

/* ---------- Événements ---------- */
function setPressed(sel, fn) { document.querySelectorAll(sel).forEach(b => b.setAttribute("aria-pressed", String(fn(b)))); }
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  state.tarif = b.dataset.tarif; store.set("tarif", state.tarif); setPressed(".seg button", x => x === b); render();
});
let qT; $("#q").oninput = e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value; render(); }, 120); };
$("#themes").onclick = e => {
  const b = e.target.closest("[data-theme]"); if (!b) return;
  const t = b.dataset.theme; state.themes.has(t) ? state.themes.delete(t) : state.themes.add(t);
  b.setAttribute("aria-pressed", String(state.themes.has(t))); render();
};
$("#flags").onclick = e => {
  const b = e.target.closest("[data-flag]"); if (!b) return;
  // Choix unique : toucher un filtre l'active seul ; le retoucher le désactive.
  const f = b.dataset.flag, wasOn = state.flags.has(f);
  state.flags.clear(); if (!wasOn) state.flags.add(f);
  setPressed("#flags [data-flag]", x => state.flags.has(x.dataset.flag)); render();
};
$("#sort").onchange = async e => {
  state.sort = e.target.value;
  if (state.sort === "dist" && !state.pos && !(await locate())) { state.sort = e.target.value = "fin"; }
  render();
};
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = async () => {
  let v = b.dataset.view;
  if (v === "near") {
    if (!state.pos && !(await locate())) return;
    state.sort = $("#sort").value = "dist"; v = "list";
  }
  state.view = v;
  setPressed("nav.tabs button", x => x === b);
  $("#v-list").hidden = v !== "list"; $("#v-map").hidden = v !== "map";
  render(); if (v === "map") $("#v-map").scrollIntoView({ block: "start" }); else window.scrollTo({ top: 0 });
});
$("#v-list").onclick = e => { const c = e.target.closest(".card"); if (c) openSheet(c.dataset.id); };
$("#sheet-bg").onclick = closeSheet;
$("#sheet").onclick = e => {
  if (e.target.closest("[data-close]")) return closeSheet();
  const f = e.target.closest("[data-fav]"); if (!f) return;
  const id = f.dataset.fav; state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
  store.set("favs", [...state.favs]); f.textContent = state.favs.has(id) ? "★ Favori" : "☆ Favori"; render();
};
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- Démarrage ---------- */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !standalone && !store.get("install-x", false)) $("#install").hidden = false;
$("#install-x").onclick = () => { $("#install").hidden = true; store.set("install-x", true); };

/* ---------- Mode jour / nuit automatique (selon l'heure) ---------- */
const META_LIGHT = "#F4F1EA", META_DARK = "#121110";
function applyMode() {
  const h = new Date().getHours(), m = h >= 20 || h < 7 ? "dark" : "light";
  const root = document.documentElement, changed = root.getAttribute("data-theme") !== m;
  root.setAttribute("data-theme", m);
  document.querySelectorAll('meta[name="theme-color"]').forEach(x => x.content = m === "dark" ? META_DARK : META_LIGHT);
  $("#mode").setAttribute("aria-label", m === "dark" ? "Mode nuit automatique" : "Mode jour automatique");
  if (changed && map && state.view === "map") render();   // recolore les repères de la carte
}
applyMode();
setInterval(applyMode, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) applyMode(); });
setPressed(".seg button", b => b.dataset.tarif === state.tarif);

async function load() {
  try {
    const r = await fetch("expositions.json", { cache: "no-cache" });
    state.data = await r.json();
  } catch {
    $("#sub").textContent = "Impossible de charger les expositions. Vérifiez la connexion."; return;
  }
  // Retire celles terminées depuis la dernière mise à jour de la base
  state.data.expositions = state.data.expositions.filter(e => !e.fin || e.fin >= iso(new Date(TODAY.getTime() - TODAY.getTimezoneOffset() * 6e4)));
  const nNew = state.data.expositions.filter(isNew).length;
  const maj = state.data.genere ? new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }).format(new Date(state.data.genere)) : "?";
  $("#sub").innerHTML = `Paris et alentours · mis à jour le ${esc(maj)}` + (nNew ? ` · <b>${nNew} nouvelle${nNew > 1 ? "s" : ""}</b>` : "");
  renderThemes(); render();
  store.set("seen", state.data.expositions.map(e => e.id));   // pour signaler les nouveautés à la prochaine visite
}
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
