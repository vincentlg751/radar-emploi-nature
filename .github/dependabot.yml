version: 2
updates:
  # Actions GitHub épinglées par SHA : Dependabot propose les mises à jour (SHA + commentaire de version).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Dépendances npm de l'application mobile (Capacitor).
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
