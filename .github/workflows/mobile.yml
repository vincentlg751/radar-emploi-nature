name: Application mobile (Android et iOS)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "radar-template.html"
      - "radar-app/**"
      - "scripts/csp.py"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

# Toutes les actions sont épinglées par SHA de commit complet (version en commentaire),
# mises à jour par Dependabot (.github/dependabot.yml).
# Aucun secret n'est utilisé : l'application relit chaque jour la liste publiée par le robot radar.yml.

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Construire l'APK
        working-directory: mobile
        run: |
          npm ci
          npm run apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ../RadarEmploi.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RadarEmploi-android
          path: RadarEmploi.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Générer le projet Xcode
        working-directory: mobile
        run: |
          npm ci
          npm run ios
      - name: Vérifier la compilation (simulateur, sans signature)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Emballer le projet Xcode
        run: cd mobile && zip -qr ../RadarEmploi-ios-xcode.zip ios -x "ios/App/build/*" "*/DerivedData/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RadarEmploi-ios-xcode
          path: RadarEmploi-ios-xcode.zip
