name: Application mobile (Android et iOS)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "radar-template.html"
      - "radar-app/**"
      - "scripts/csp.py"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

# Toutes les actions sont épinglées par SHA de commit complet (version en commentaire),
# mises à jour par Dependabot (.github/dependabot.yml).
# Aucun secret n'est utilisé : l'application relit chaque jour la liste publiée par le robot radar.yml.

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Construire l'APK
        working-directory: mobile
        run: |
          npm ci
          npm run apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ../RadarEmploi.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RadarEmploi-android
          path: RadarEmploi.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Générer le projet Xcode
        working-directory: mobile
        run: |
          npm ci
          npm run ios
      - name: Vérifier la compilation (simulateur, sans signature)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Emballer le projet Xcode
        run: cd mobile && zip -qr ../RadarEmploi-ios-xcode.zip ios -x "ios/App/build/*" "*/DerivedData/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RadarEmploi-ios-xcode
          path: RadarEmploi-ios-xcode.zip
